name: Generate update PR for the Dynamic Plugins tables

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the script from"
        required: true
        default: "main"
  # Weekly: Monday 04:00 UTC (~ Sunday 11pm Eastern / 8pm Pacific). Scheduled workflows use the default branch YAML.
  schedule:
    - cron: "0 4 * * 1"

jobs:
  discover-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.discover.outputs.branches }}
    steps:
      - name: Discover target branches
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            refs="$(git ls-remote --heads "$REPOSITORY_URL" 'refs/heads/release-*')"
            mapfile -t releases < <(
              printf '%s\n' "$refs" |
                sed 's#.*refs/heads/##' |
                grep -E '^release-[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 3
            )

            ((${#releases[@]} > 0)) || {
              echo "No release-X.Y branches found" >&2
              exit 1
            }
            branches=(main "${releases[@]}")
          else
            [[ "$INPUT_BRANCH" =~ ^(main|release-[0-9]+\.[0-9]+)$ ]] || {
              echo "Invalid branch: $INPUT_BRANCH" >&2
              exit 1
            }
            git ls-remote --exit-code --heads \
              "$REPOSITORY_URL" "refs/heads/$INPUT_BRANCH" >/dev/null
            branches=("$INPUT_BRANCH")
          fi

          branches_json="$(
            python3 -c \
              'import json, sys; print(json.dumps(sys.argv[1:]))' \
              "${branches[@]}"
          )"
          echo "branches=$branches_json" >> "$GITHUB_OUTPUT"

  run-script:
    needs: discover-branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch: ${{ fromJSON(needs.discover-branches.outputs.branches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.target_branch }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install yq
          echo "Installed `yq` version: $(yq --version)"
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          echo "Installed skopeo version: $(skopeo --version)"
          echo "Installed jq version: $(jq --version)"

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run the script on branch
        run: bash modules/extend_dynamic-plugins-reference/rhdh-supported-plugins.sh -b ${{ matrix.target_branch }}

      - name: Generate dynamic plugin comparisons
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
        run: |
          if [[ "$TARGET_BRANCH" != "main" && ! "$TARGET_BRANCH" =~ ^release-2\..+$ ]]; then
            exit 0
          fi

          diff_script="modules/extend_dynamic-plugins-reference/diff-previous.sh"

          # First output: one rolling cross-release comparison. For 2.1.1,
          # 1-10-6-to-2-1-1 replaces the earlier 1-10-6-to-2-1-0 file and link.
          bash "$diff_script" -b "$TARGET_BRANCH" --diff-previous

          product_version=$(awk '$1 == ":product-bundle-version:" { print $2; exit }' artifacts/attributes.adoc)
          if [[ ! "$product_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid or missing product-bundle-version: ${product_version:-empty}" >&2
            exit 1
          fi

          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=$((10#${BASH_REMATCH[3]}))
          if (( patch == 0 )); then
            exit 0
          fi

          previous_tag="${major}.${minor}.$((patch - 1))"
          if git rev-parse -q --verify "refs/tags/${previous_tag}^{commit}" >/dev/null; then
            # Optional second output: the current patch delta. For 2.1.1, this
            # creates 2-1-0-to-2-1-1. Patch files remain as release history, so
            # a later 2-1-1-to-2-1-2 file does not replace this one.
            bash "$diff_script" -b "$TARGET_BRANCH" --diff "$previous_tag"
          else
            echo "Tag $previous_tag does not exist; skipping patch comparison."
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: automated update of dynamic plugin tables"
          title: "Automated update of dynamic plugin tables for ${{ matrix.target_branch }}"
          body: "This PR was automatically generated by running rhdh-supported-plugins.sh."
          # Fixed branch makes subsequent runs update the existing PR.
          branch: "update-${{ matrix.target_branch }}"
          base: ${{ matrix.target_branch }}
