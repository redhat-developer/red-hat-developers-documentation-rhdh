---
name: Update artifacts/attributes.adoc version attributes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        required: true
        default: "main"
      dry-run:
        description: "Print the diff without committing changes"
        required: false
        default: false
        type: boolean
  # Weekly: Friday 03:00 UTC, so the PR can be merged before the Monday
  # plugin-catalog-index update. Scheduled workflows use the default branch YAML.
  schedule:
    - cron: "0 3 * * 5"


jobs:
  discover-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branches: ${{ steps.discover.outputs.branches }}
    steps:
      - name: Discover target branches
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            # Only main and release-2.* are maintained by this workflow.
            refs="$(git ls-remote --heads "$REPOSITORY_URL" 'refs/heads/release-*')"
            mapfile -t releases < <(
              printf '%s\n' "$refs" |
                sed 's#.*refs/heads/##' |
                grep -E '^release-2\.[0-9]+$' |
                sort -V
            )

            branches=(main "${releases[@]}")
          else
            [[ "$INPUT_BRANCH" =~ ^(main|release-2\.[0-9]+)$ ]] || {
              echo "Invalid branch: $INPUT_BRANCH" >&2
              exit 1
            }
            git ls-remote --exit-code --heads \
              "$REPOSITORY_URL" "refs/heads/$INPUT_BRANCH" >/dev/null
            branches=("$INPUT_BRANCH")
          fi

          branches_json="$(
            python3 -c \
              'import json, sys; print(json.dumps(sys.argv[1:]))' \
              "${branches[@]}"
          )"
          echo "branches=$branches_json" >> "$GITHUB_OUTPUT"

  update-attributes:
    needs: discover-branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target_branch: ${{ fromJSON(needs.discover-branches.outputs.branches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.target_branch }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          echo "Installed skopeo version: $(skopeo --version)"
          echo "Installed jq version: $(jq --version)"

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run the update script
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          # OpenShift Serverless minor tracked by each stream; the z is
          # computed from the ocp-serverless-tenant registry tags.
          serverless_minor="1.37"
          case "$TARGET_BRANCH" in
            release-1.*) echo "Unsupported branch $TARGET_BRANCH" >&2; exit 1 ;;
          esac

          args=(-b "$TARGET_BRANCH" --serverless-minor "$serverless_minor")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          bash scripts/update-attributes-adoc.sh "${args[@]}"

      - name: Create Pull Request
        if: github.event.inputs.dry-run != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(docs): [${{ matrix.target_branch }}] update attributes.adoc version attributes"
          title: "chore(docs): [${{ matrix.target_branch }}] update attributes.adoc version attributes"
          body: |
            Updates the version attributes in `artifacts/attributes.adoc` from
            upstream sources (rhdh, rhdh-operator, rhdh-chart, the plugin
            catalog index, the RHDH life cycle page and the serverless
            operator registry), per RHIDP-19177.

            Auto-generated by workflow: *${{ github.workflow }}*
          branch: "chore/automated-update-attributes-${{ matrix.target_branch }}"
          base: ${{ matrix.target_branch }}
