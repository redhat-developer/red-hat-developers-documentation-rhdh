---
name: Update artifacts/attributes.adoc version attributes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        required: true
        default: "main"
  # Weekly: Friday 03:00 UTC, so the PR can be merged before the Monday
  # plugin-catalog-index update. Scheduled workflows use the default branch YAML.
  schedule:
    - cron: "0 3 * * 5"


jobs:
  discover-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branches: ${{ steps.discover.outputs.branches }}
    steps:
      - name: Discover target branches
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            # main plus the three newest release-X.Y branches (see
            # modules/extend_dynamic-plugins-reference/README.md), then drop
            # any whose maintenance support has ended, using the Product Life
            # Cycles API (the data behind
            # https://access.redhat.com/support/policy/updates/developerhub).
            refs="$(git ls-remote --heads "$REPOSITORY_URL" 'refs/heads/release-*')"
            mapfile -t releases < <(
              printf '%s\n' "$refs" |
                sed 's#.*refs/heads/##' |
                grep -E '^release-[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 3
            )

            ((${#releases[@]} > 0)) || {
              echo "No release-X.Y branches found" >&2
              exit 1
            }

            lifecycle_json="$(
              curl -sf --retry 3 --retry-delay 30 \
                "https://access.redhat.com/product-life-cycles/api/v1/products?name=Red+Hat+Developer+Hub"
            )" || {
              echo "[WARN] Product Life Cycles API unreachable; keeping the three newest branches." >&2
              lifecycle_json=""
            }
            today="$(date -u +%F)"
            supported=()
            for branch in "${releases[@]}"; do
              version="${branch#release-}"
              eol=""
              if [[ -n "$lifecycle_json" ]]; then
                eol="$(
                  jq -er --arg version "$version" '
                    .data[0].versions[] | select(.name == $version) | .phases[]
                    | select(.name == "Maintenance support") | .date | split("T")[0]
                  ' <<<"$lifecycle_json" 2>/dev/null
                )" || eol=""
              fi
              # Unknown version (not in the API yet) stays: only a confirmed
              # past maintenance-support date drops a branch.
              if [[ -n "$eol" && "$today" > "$eol" ]]; then
                echo "Skipping $branch: maintenance support ended $eol (EOL)."
                continue
              fi
              supported+=("$branch")
            done
            ((${#supported[@]} > 0)) || {
              echo "No supported release-X.Y branches found" >&2
              exit 1
            }
            branches=(main "${supported[@]}")
          else
            [[ "$INPUT_BRANCH" =~ ^(main|release-[0-9]+\.[0-9]+)$ ]] || {
              echo "Invalid branch: $INPUT_BRANCH" >&2
              exit 1
            }
            git ls-remote --exit-code --heads \
              "$REPOSITORY_URL" "refs/heads/$INPUT_BRANCH" >/dev/null
            branches=("$INPUT_BRANCH")
          fi

          branches_json="$(
            python3 -c \
              'import json, sys; print(json.dumps(sys.argv[1:]))' \
              "${branches[@]}"
          )"
          echo "branches=$branches_json" >> "$GITHUB_OUTPUT"

  update-attributes:
    needs: discover-branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target_branch: ${{ fromJSON(needs.discover-branches.outputs.branches) }}
    steps:
      - name: Resolve checkout ref
        id: checkout-ref
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail

          # When the update PR branch already exists, check it out so that
          # create-pull-request appends a commit on top of its history;
          # checking out the base branch instead makes the action reset the PR
          # branch, which force-pushes away commits pushed to it by others.
          # Exit status 2 means the branch does not exist, which is not an
          # error.
          ref=""
          git ls-remote --exit-code --heads \
            "$REPOSITORY_URL" "refs/heads/update-attributes-$TARGET_BRANCH" >/dev/null
          status=$?
          if [[ $status -eq 0 ]]; then
            ref="update-attributes-$TARGET_BRANCH"
          elif [[ $status -eq 2 ]]; then
            ref="$TARGET_BRANCH"
          else
            echo "::error::Could not list update-attributes-$TARGET_BRANCH (exit $status)."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}
          fetch-depth: 0

      # Set the git identity before any step that can create commits: the
      # merge below fails with "Committer identity unknown" otherwise.
      - name: Set up Git user
        run: |
          git config --global user.name "rhdh-bot service account"
          git config --global user.email "rhdh-bot@redhat.com"

      - name: Merge the target branch into the existing update branch
        if: steps.checkout-ref.outputs.ref != matrix.target_branch
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
        run: |
          set -euo pipefail

          # Keep the PR branch current with its base by merging rather than
          # rebasing: a rebase rewrites history and force-pushes away commits
          # pushed to the PR branch by others. A conflict fails this run
          # loudly instead of leaving a conflicted pull request.
          git fetch origin "$TARGET_BRANCH"
          if ! git merge --no-edit "origin/$TARGET_BRANCH"; then
            echo "::error::Conflicts merging $TARGET_BRANCH into update-attributes-$TARGET_BRANCH. Resolve the open pull request manually."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          echo "Installed skopeo version: $(skopeo --version)"
          echo "Installed jq version: $(jq --version)"

      - name: Run the update script
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
        run: bash scripts/update-attributes-adoc.sh -b "$TARGET_BRANCH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(docs): [${{ matrix.target_branch }}] update attributes.adoc version attributes"
          title: "chore(docs): [${{ matrix.target_branch }}] update attributes.adoc version attributes"
          body: |
            Updates the version attributes in `artifacts/attributes.adoc` from
            upstream sources (rhdh, rhdh-operator, rhdh-chart, the plugin
            catalog index, the RHDH life cycle page and the serverless
            operator registry), per RHIDP-19177.

            Auto-generated by workflow: *${{ github.workflow }}*
          branch: "update-attributes-${{ matrix.target_branch }}"
          base: ${{ matrix.target_branch }}
